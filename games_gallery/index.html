<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Gallery | Tuituineo</title>
    <link rel="icon" type="image/png" href="/games_gallery/icon.jpg" />
    <script src="/tailwind.js"></script>

    <link href="/style.css" rel="stylesheet" type="text/css" media="all" />
  </head>
  <body>
    <div class="television">
      <div class="ds-total">
        <img class="ds-image" src="ds.png" alt="DS" />
        <div class="top-rectangle">
          <iframe
            frameborder="0"
            src=""
            allowfullscreen
            style="
              border-radius: 12px;
              display: block;
              height: 253px;
              width: 440px;
            "
            width="440"
            height="253"
          >
            <a href="https://tuituineo.itch.io/new-year"
              >Play new year on itch.io</a
            >
          </iframe>
        </div>
        <div class="bottom-rectangle">
          <div class="swipe-container">
            <div class="icon-grid">
              <div
                class="icon-item"
                data-iframe="https://itch.io/embed-upload/16013232?color=000000"
              >
                <img
                  src="/games_gallery/cover/square_new_year.png"
                  alt="new year"
                /><span></span>
              </div>
              <div
                class="icon-item"
                data-iframe="https://itch.io/embed-upload/16032925?color=333333"
              >
                <img
                  src="/games_gallery/cover/square_home.png"
                  alt="home"
                /><span></span>
              </div>
              <div
                class="icon-item"
                data-iframe="https://itch.io/embed-upload/16082840?color=ffffff"
              >
                <img
                  src="/games_gallery/cover/square_talk.png"
                  alt="talk"
                /><span></span>
              </div>
              <div
                class="icon-item"
                data-iframe="https://itch.io/embed-upload/16169136?color=ffffff"
              >
                <img
                  src="/games_gallery/cover/square_cutecats.png"
                  alt="cutecats"
                /><span></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <style>
      .swipe-container {
        overflow-x: auto;
        overflow-y: hidden;
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
      }
      .icon-grid {
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: repeat(2, 1fr);
        padding-left: 1em;
        gap: 5px;
        height: 100%;
        align-items: center;
      }
      .icon-item {
        width: 114px;
        height: 114px;
        background: #fff;
        border-radius: 23px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 4px 16px 0 rgba(0, 0, 0, 0.1),
          0 0 0 0px #e0e0e0;
        border: 2px solid #9f9f9f;
        cursor: pointer;
        color: #222;
        font-size: 12px;
        user-select: none;
        transition:
          box-shadow 0.2s,
          border-color 0.2s;

        align-items: center;
        padding: 20px 25px 20px 22px;
        box-shadow: rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;
        border-style: solid;
        border-width: 9p;
        font-size: 25px;
        cursor: pointer;
        font-weight: 900;
        color: rgb(134, 124, 124);
        font-family: monospace;
        transition:
          transform 400ms cubic-bezier(0.68, -0.55, 0.27, 2.5),
          border-color 400ms ease-in-out,
          background-color 400ms ease-in-out;
        word-spacing: -2px;
      }
      .icon-item:hover {
        box-shadow:
          0 6px 20px 0 rgba(0, 0, 0, 0.18),
          0 0 0 2.5px #b3e5fc;
        border-color: #b3e5fc;
      }
      .icon-item img {
        width: 75px;
        object-fit: contain;
        margin-bottom: 4px;
        border-radius: 10px;
        background: #f8f8f8;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.07);
      }
      .ds-total {
        position: relative;
        width: 648px;
        height: fit-content;
        background: no-repeat center center;
        background-size: contain;
      }

      .television {
        display: flex;
        justify-content: center;
        background: url(background.png) no-repeat center center;
      }
      .ds-image {
        pointer-events: none;
        height: fit-content;
      }
      .top-rectangle {
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        /* background: green; */
        border-radius: 5px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        width: 441px;
        height: 273px;
        padding: 0;
        margin: 0 auto;
        z-index: 1;
        position: relative;
        top: -645px;
      }

      .bottom-rectangle {
        position: absolute;
        background-color: #dcdcd0;
        top: 389px;
        width: 346px;
        height: 260px;
        border-radius: 6px;
        right: 23%;
      }
    </style>
    <script>
      // Rendre chaque icône cliquable pour changer le src de l'iframe du haut et focus l'iframe
      document.addEventListener("DOMContentLoaded", function () {
        const icons = document.querySelectorAll(".icon-item");
        const iframe = document.querySelector(".top-rectangle iframe");
        icons.forEach((icon) => {
          icon.addEventListener("click", function () {
            const newSrc = icon.getAttribute("data-iframe");
            if (newSrc && iframe) {
              iframe.src = newSrc;
              setTimeout(() => {
                try {
                  iframe.focus();
                } catch (e) {}
              }, 100);
            }
          });
        });
      });
    </script>
  </body>
</html>
